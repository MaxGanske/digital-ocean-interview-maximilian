services:
  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - url_shortener_postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d url_shortener"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  url_shortener_postgres: