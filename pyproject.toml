[tool.poetry]
name = "url-shortener"
version = "0.1.0"
description = "A small URL shortener REST API (skeleton)."
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.100.0"
uvicorn = {extras = ["standard"], version = "^0.22.0"}
pydantic = "^2.6.0"
sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9"

[tool.poetry.dev-dependencies]
black = "^23.12"
ruff = "^0.13"
isort = "^5.12"
pytest = "^7.0"
httpx = "^0.24"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "C", "B", "R"]

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "C", "B", "R"]
