[tool.poetry]
name = "url-shortener"
version = "0.1.0"
description = "FastAPI URL shortener"
authors = ["Max Ganske"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.116"
uvicorn = { extras = ["standard"], version = "^0.35" }
pydantic = "^2.11"
pydantic-settings = "^2.10"
sqlalchemy = "^2.0"
psycopg = { extras = ["binary"], version = "^3.2" }

[tool.poetry.group.dev.dependencies]
pytest = "^8.4"
httpx = "^0.28"
ruff = "^0.13"

[tool.ruff]
line-length = 88

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"